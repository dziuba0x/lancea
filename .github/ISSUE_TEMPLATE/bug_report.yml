name: Bug
description: Something the guard, the autopilot, the services or the dashboard did wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "A way past the guard is a vulnerability: please report it privately (Security → Report a vulnerability), not here."
  - type: textarea
    attributes: { label: What happened, description: "The payment, the step or the page, and what you expected." }
    validations: { required: true }
  - type: textarea
    attributes: { label: How to see it again, description: "Commands, config (no keys), transaction hashes on testnet." }
  - type: input
    attributes: { label: Version, description: "The commit or release." }
